const MODE_KEYS = Object.keys(MODES);

const state = { time: null, week: null, weather: null };

function lsGet(k, fallback) {
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
}
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function initTaps(rowId, key) {
  const row = document.getElementById(rowId);
  row.querySelectorAll('.tap-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      row.querySelectorAll('.tap-btn').forEach(b => {b.classList.remove('active');b.setAttribute('aria-pressed','false');});
      btn.classList.add('active');btn.setAttribute('aria-pressed','true');
      state[key] = btn.dataset.val;
      checkReady();
    });
  });
}
initTaps('timeRow', 'time');
initTaps('weekRow', 'week');

function checkReady() {
  document.getElementById('goBtn').disabled = !(state.time && state.week);
}

function daylightMinutesLeft(sunsetIso, tz) {
  if (!sunsetIso) return null;
  const sunset = new Date(sunsetIso);
  const now = new Date();
  return Math.round((sunset - now) / 60000);
}

function moonPhase(date = new Date()) {
  // Days since a known new moon (Jan 6, 2000), synodic month ~29.53 days.
  const knownNewMoon = new Date(Date.UTC(2000, 0, 6, 18, 14));
  const synodic = 29.53058867;
  const daysSince = (date.getTime() - knownNewMoon.getTime()) / 86400000;
  const age = ((daysSince % synodic) + synodic) % synodic;
  const illumination = Math.round((1 - Math.cos((age / synodic) * 2 * Math.PI)) / 2 * 100);
  let name;
  if (age < 1.84) name = 'New Moon';
  else if (age < 5.53) name = 'Waxing Crescent';
  else if (age < 9.22) name = 'First Quarter';
  else if (age < 12.91) name = 'Waxing Gibbous';
  else if (age < 16.61) name = 'Full Moon';
  else if (age < 20.30) name = 'Waning Gibbous';
  else if (age < 23.99) name = 'Last Quarter';
  else if (age < 27.68) name = 'Waning Crescent';
  else name = 'New Moon';
  return { name, illumination };
}

async function loadWeather() {
  const strip = document.getElementById('weatherStrip');
  try {
    const r = await fetch('https://transmissionalbum.netlify.app/.netlify/functions/rewind-oracle-context');
    const c = await r.json();if(!r.ok||!c.weather?.current)throw Error('Weather unavailable');
    const w=c.weather.current,rawSunset=c.weather.daily?.sunset?.[0],offset=c.weather.utc_offset_seconds,sunset=rawSunset&&Number.isFinite(offset)?new Date(Date.parse(rawSunset+'Z')-offset*1000).toISOString():null,data={cloudCover:w.cloud_cover,temp:w.temperature_2m,isDay:w.is_day,sunset,trend:'steady'};
    state.weather = data;
    const mins = daylightMinutesLeft(data.sunset);
    const cloud = data.cloudCover;
    const cloudWord = cloud == null ? '' : cloud < 20 ? 'clear skies' : cloud < 60 ? 'partly cloudy' : 'overcast';
    const trendWord = data.trend === 'clearing' ? ', clearing up' : data.trend === 'building' ? ', clouding over' : '';
    const daylightWord = data.isDay === 0 ? 'after dark' : (mins != null && mins > 0 ? `~${mins < 60 ? mins + ' min' : Math.round(mins/60) + ' hr'} of daylight left` : 'daylight fading');
    strip.textContent = `Kalispell · ${cloudWord}${trendWord}, ${daylightWord}, ${data.temp != null ? Math.round(data.temp) + '°' : ''} · ${moonPhase().name}`;
  } catch (e) {
    strip.textContent = 'sky unreadable, going in blind';
    state.weather = { cloudCover: null, isDay: 1, sunset: null };
  }
}

function weatherTargetTag() {
  const w = state.weather;
  if (!w || w.cloudCover == null) return null;
  const mins = daylightMinutesLeft(w.sunset);
  const dark = w.isDay === 0 || (mins != null && mins < 30);
  if (w.cloudCover >= 60 || dark) return 'dread';
  if (w.cloudCover < 20 && !dark) return 'open';
  return 'cozy';
}

function pickMode() {
  const last = lsGet('modeLastShown', {});
  let best = MODE_KEYS[0], bestTime = Infinity;
  MODE_KEYS.forEach(k => {
    const t = last[k] || 0;
    if (t < bestTime) { bestTime = t; best = k; }
  });
  return best;
}

function energyAllowed(tag, time, week) {
  const capByTime = { quick: ['low'], medium: ['low','med'], evening: ['low','med','high'], open: ['low','med','high'] };
  const capByWeek = { tight: ['low','med'], normal: ['low','med','high'], loose: ['low','med','high'] };
  return capByTime[time].includes(tag) && capByWeek[week].includes(tag);
}

function scoreGame(g, modeKey, weatherTag) {
  let score = 0;
  if (weatherTag && g.weather === weatherTag) score += 3;
  if (weatherTag === 'dread' && g.weather === 'puzzle') score += 1;
  const recent = lsGet('gameLastShown', {});
  const last = recent[g.name] || 0;
  const daysSince = (Date.now() - last) / 86400000;
  score += Math.min(daysSince / 7, 4);
  if (g.replay && g.replay.toLowerCase().includes('high')) score += modeKey === 'replay' ? 2 : 0.5;
  score += GameHistory.evidence(g, POOL).score;
  score += Math.random() * 1.5;
  return score;
}

function getCandidates(modeKey) {
  const mode = MODES[modeKey];
  const time = state.time, week = state.week;
  let cands = POOL.filter(g => mode.buckets.includes(g.bucket));
  if (modeKey === 'replay') cands = cands.filter(g => g.replay && /high/i.test(g.replay));
  let filtered = cands.filter(g => energyAllowed(g.energy, time, week));
  if (filtered.length === 0) filtered = cands;
  return filtered;
}

function pickGame(modeKey) {
  const weatherTag = weatherTargetTag();
  let cands = getCandidates(modeKey);
  if (cands.length === 0) return null;
  cands.sort((a, b) => scoreGame(b, modeKey, weatherTag) - scoreGame(a, modeKey, weatherTag));
  return cands[0];
}

function reasonText(g, modeKey, weatherTag) {
  const bits = [];
  const modeSentence = {
    start: "Something new, or a brief first encounter worth another look. No sequel homework tonight.",
    finish: "A game marked as in progress. Pick up the thread instead of meeting another tutorial.",
    comfort: "You know this one already, easy to drop back into.",
    replay: "Full replay itch, this one's built to hold up a second time.",
  };
  bits.push(modeKey==='finish'&&g.bucket==='Played · progress unknown'?"A return visit. The console knows you played it; it does not know whether you finished it.":modeSentence[modeKey]);
  if (weatherTag === 'dread') bits.push("The sky gives this one some cover. Indoors, it has its own problems.");
  if (weatherTag === 'open') bits.push("Clear and bright out, plenty of daylight left, good conditions for something open and sprawling.");
  if (weatherTag === 'cozy') bits.push("Middling sky, nothing dramatic, good night for something quieter.");
  if (state.time === 'quick') bits.push("Short window tonight, so nothing that demands a big runway to get into.");
  if (state.week === 'tight') bits.push("Week's packed, so keeping the commitment level realistic.");
  const evidence = GameHistory.evidence(g, POOL);
  if(evidence.connection) bits.push(`${evidence.connection.name} got about ${Math.round(evidence.connection.history.minutes/60)} recorded hours out of you. This heads down a nearby ${g.genre.toLowerCase()} corridor. Different game, familiar bad decision.`);
  if(g.history) bits.push(`Your snapshot logs ${g.history.minutes<60 ? g.history.minutes+" minutes" : "about "+Math.round(g.history.minutes/60)+" hours"} here. That records time, not a completed story.`);
  if (g.note && g.note!=="Same") bits.push(g.note + ".");
  return bits.join(' ');
}

function topCandidates(modeKey, n) {
  const weatherTag = weatherTargetTag();
  let cands = getCandidates(modeKey);
  if (cands.length === 0) return [];
  cands.sort((a, b) => scoreGame(b, modeKey, weatherTag) - scoreGame(a, modeKey, weatherTag));
  return cands.slice(0, n);
}

function psnSummary() {
  if (!lastPsnData) return null;
  const top = [...lastPsnData.playedGames]
    .map(g => ({ name: g.name, hrs: (parseIsoDuration(g.playDuration) / 60) }))
    .sort((a, b) => b.hrs - a.hrs)
    .slice(0, 8)
    .map(g => `${g.name} (${g.hrs.toFixed(1)}h)`)
    .join(", ");
  return top || null;
}

function normalizeName(s) {
  return (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
}

function withPsnProgress(candidates) {
  if (!lastPsnData || !lastPsnData.trophyTitles) return candidates;
  return candidates.map(c => {
    const norm = normalizeName(c.name);
    const match = lastPsnData.trophyTitles.find(t => {
      const tn = normalizeName(t.name);
      return tn === norm || tn.includes(norm) || norm.includes(tn);
    });
    return match ? { ...c, psnProgress: match.progress } : c;
  });
}

async function aiChoose(){return null;}

let renderToken = 0;

async function loadCover(name, token) {
  const img = document.getElementById('gameCover');
  try {
    const res = await fetch(`/games-cover?q=${encodeURIComponent(name)}`);
    const data = await res.json();
    if (token !== renderToken) return;
    if (data.image) {
      img.src = data.image;
      img.alt = name;
      img.classList.remove('hidden');
    } else {
      img.classList.add('hidden');
      img.removeAttribute('src');
    }
  } catch (e) {
    if (token === renderToken) img.classList.add('hidden');
  }
}

function markShown(g, modeKey) {
  const modeLast = lsGet('modeLastShown', {});
  modeLast[modeKey] = Date.now();
  lsSet('modeLastShown', modeLast);
  const gameLast = lsGet('gameLastShown', {});
  gameLast[g.name] = Date.now();
  lsSet('gameLastShown', gameLast);
}

const MODE_COLOR = { start: '#5eead4', finish: '#f5c451', comfort: '#ff5d8f', replay: '#a78bfa' };

function applyModeColor(modeKey) {
  const color = MODE_COLOR[modeKey] || '#f5c451';
  const card = document.getElementById('resultCard');
  card.style.borderColor = color;
  document.getElementById('modeTag').style.color = color;
}

async function renderResult(modeKey) {
  const myToken = ++renderToken;
  const shortlist = topCandidates(modeKey, 6);
  if (shortlist.length === 0) {
    document.getElementById('weatherStrip').textContent = 'nothing fits those constraints, try loosening one';
    return;
  }
  const card = document.getElementById('resultCard');
  card.classList.remove('hidden');
  applyModeColor(modeKey);
  document.getElementById('modeTag').textContent = MODES[modeKey].label + ' · thinking…';
  document.getElementById('gameName').textContent = 'Shuffling the deck…';
  document.getElementById('gameMeta').textContent = '';
  document.getElementById('gameWhy').textContent = '';
  document.getElementById('passedBlock').innerHTML = '';
  document.getElementById('gameCover').classList.add('hidden');
  document.getElementById('gameCover').removeAttribute('src');

  const aiResult = await aiChoose(modeKey, shortlist);
  if (myToken !== renderToken) return;
  const g = aiResult ? aiResult.game : shortlist[0];
  const why = aiResult ? aiResult.why : reasonText(g, modeKey, weatherTargetTag());

  document.getElementById('modeTag').textContent = MODES[modeKey].label + (aiResult ? '' : ' · local pick');
  document.getElementById('gameName').textContent = g.name;
  document.getElementById('gameMeta').textContent = `${g.genre || g.type || ''}${g.hours ? ' · ~'+g.hours+' hr story estimate' : ''}${g.history ? ' · PS snapshot: '+(g.history.minutes<60 ? g.history.minutes+' min' : Math.round(g.history.minutes/60)+' hr') : ''}`;
  document.getElementById('gameWhy').textContent = why;

  const passedBlock = document.getElementById('passedBlock');
  if (aiResult && aiResult.passed && aiResult.passed.length) {
    passedBlock.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'passed-block';
    const label = document.createElement('div');
    label.className = 'passed-label';
    label.textContent = 'Also on the table tonight';
    wrap.appendChild(label);
    aiResult.passed.forEach(p => {
      const row = document.createElement('div');
      row.className = 'passed-row';
      row.innerHTML = `<b>${p.name}</b>: ${p.reason}`;
      wrap.appendChild(row);
    });
    passedBlock.appendChild(wrap);
  }

  card.dataset.mode = modeKey;
  card.dataset.game = g.name;

  markShown(g, modeKey);
  if(g.history?.cover){const image=document.getElementById("gameCover");image.src=g.history.cover;image.alt=g.name;image.classList.remove("hidden");}else loadCover(g.name, myToken);

  document.getElementById('footerNote').textContent = `PlayStation snapshot: Oct 9, 2026 · local selection · AI writing and live PS5 sync are not connected here yet.`;
}

document.getElementById('goBtn').addEventListener('click', () => {
  const modeKey = pickMode();
  renderResult(modeKey);
});

document.getElementById('rerollBtn').addEventListener('click', () => {
  const modeKey = document.getElementById('resultCard').dataset.mode;
  renderResult(modeKey);
});

document.getElementById('switchModeBtn').addEventListener('click', () => {
  const current = document.getElementById('resultCard').dataset.mode;
  const others = MODE_KEYS.filter(k => k !== current);
  const modeKey = others[Math.floor(Math.random() * others.length)];
  renderResult(modeKey);
});

function parseIsoDuration(iso) {
  if (!iso) return 0;
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?/);
  if (!m) return 0;
  return (parseInt(m[1] || 0) * 60) + parseInt(m[2] || 0);
}

let lastPsnData = null;
let syncSort = 'recent';

function renderSyncPanel() {
  const panel = document.getElementById('syncPanel');
  if (!lastPsnData) return;
  const games = lastPsnData.playedGames.map(g => ({
    name: g.name,
    hrs: parseIsoDuration(g.playDuration) / 60,
    last: g.lastPlayed ? new Date(g.lastPlayed).getTime() : 0,
  }));
  const sorted = [...games].sort((a, b) => syncSort === 'hours' ? b.hrs - a.hrs : b.last - a.last);

  panel.innerHTML = '';
  const count = document.createElement('div');
  count.className = 'sync-count';
  count.textContent = `${lastPsnData.totalPlayed} titles played · ${lastPsnData.totalTrophyTitles} with trophies`;
  panel.appendChild(count);

  const sortRow = document.createElement('div');
  sortRow.className = 'sync-sort';
  ['recent', 'hours'].forEach(s => {
    const btn = document.createElement('div');
    btn.className = 'sync-sort-btn' + (syncSort === s ? ' active' : '');
    btn.textContent = s === 'recent' ? 'By Recency' : 'By Hours';
    btn.addEventListener('click', () => { syncSort = s; renderSyncPanel(); });
    sortRow.appendChild(btn);
  });
  panel.appendChild(sortRow);

  sorted.forEach(g => {
    const row = document.createElement('div');
    row.className = 'sync-row';
    row.innerHTML = `<span class="sync-title">${g.name}</span><span class="sync-detail">${g.hrs ? g.hrs.toFixed(1) + 'h' : '?'}</span>`;
    panel.appendChild(row);
  });

  if (lastPsnData.rotatedRefreshToken) {
    const warn = document.createElement('div');
    warn.className = 'sync-err';
    warn.style.marginTop = '10px';
    warn.textContent = 'Token rotated, update PSN_REFRESH_TOKEN in Netlify with the new value (check function logs).';
    panel.appendChild(warn);
    console.log('NEW REFRESH TOKEN:', lastPsnData.rotatedRefreshToken);
  }
}

document.getElementById('syncBtn').addEventListener('click', async () => {
  const panel = document.getElementById('syncPanel');
  panel.classList.remove('hidden');
  panel.textContent = 'pulling the full library, this takes a bit…';
  try {
    const res = await fetch('/games-psn');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    lastPsnData = data;
    renderSyncPanel();
  } catch (e) {
    panel.innerHTML = `<div class="sync-err">Sync failed: ${e.message}. Refresh token may need renewing.</div>`;
  }
});
