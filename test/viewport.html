<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rewind layout check</title><style>body{margin:0;background:#cdd4cf;color:#19262c;font:14px system-ui}header{display:flex;gap:8px;align-items:center;padding:12px;flex-wrap:wrap}button{min-height:44px;padding:10px 16px;border:1px solid #86978d;border-radius:7px;background:#fff;color:#19262c;cursor:pointer}button[aria-pressed=true]{background:#19262c;color:#fff}main{overflow:auto;padding:0 12px 12px;display:grid;justify-items:center}iframe{border:1px solid #86978d;border-radius:12px;background:#f5f3ee;width:390px;max-width:none;height:calc(100vh - 85px)}</style><header><strong>Layout check</strong><button data-width="320" aria-pressed="false">320px</button><button data-width="390" aria-pressed="true">390px</button><button data-width="768" aria-pressed="false">768px</button><button data-width="1024" aria-pressed="false">1024px</button><select aria-label="Page to inspect" id="preview-page"><option value="../index.html">Films</option><option value="../music/index.html">Music</option><option value="../music/arena/index.html">Album Arena</option><option value="../games/index.html">Games</option></select><span>Uses this browser’s existing data.</span></header><main><iframe title="Rewind at the selected viewport" src="../index.html"></iframe></main><script>for(const b of document.querySelectorAll('button'))b.onclick=()=>{document.querySelector('iframe').style.width=b.dataset.width+'px';for(const button of document.querySelectorAll('button'))button.setAttribute('aria-pressed',String(button===b));};document.getElementById('preview-page').onchange=e=>document.querySelector('iframe').src=e.target.value;</script></html>
