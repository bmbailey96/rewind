name: Refresh Roxy showtimes
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/refresh-roxy.cjs
      - lib/roxy-cinema.cjs
      - .github/workflows/roxy-showtimes.yml
permissions:
  contents: write
concurrency:
  group: roxy-showtimes
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch the official calendar
        run: node scripts/refresh-roxy.cjs
      - name: Save checked listings
        run: |
          if git diff --quiet -- roxy-snapshot.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add roxy-snapshot.json
          git commit -m 'Refresh official Roxy screenings'
          git pull --rebase origin main
          git push origin HEAD:main
